name: Reconciliation

on:
  schedule:
    - cron: '0 4 * * 0'  # Domingo às 04:00 UTC
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Validate env
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL não configurado"
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::DIRECT_URL não configurado"
            exit 1
          fi
          echo "✓ Variáveis de ambiente OK"

      - name: Reconcile parlamentares
        run: npm run reconcile:parlamentares
        continue-on-error: true  # divergência (exit code 1) não é falha do workflow

      - name: Reconcile votações (amostra)
        run: npm run reconcile:votacoes
        continue-on-error: true
