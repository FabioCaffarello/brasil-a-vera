name: Ingestão diária

# Roda 1x/dia (02:00 UTC = 23:00 do dia anterior em Brasília) para
# entidades que mudam pouco: deputados, senadores, proposições.
#
# Votações têm cadência maior — ver ingestion-votacoes.yml.
# Gastos têm cadência menor — ver ingestion-weekly.yml.
#
# Secrets necessários no repositório (configurar via gh secret set):
#   - DATABASE_URL                    (conexão pooled, usada pela aplicação)
#   - DIRECT_URL                      (conexão direta, usada pelo Drizzle Kit)
#   - DISCORD_INGESTION_WEBHOOK_URL   (alerta de falha; opcional — skip clean se ausente)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ingestion-daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deputados:
    name: Sync deputados da Câmara
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest:camara:deputados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_INGESTION_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: ingestion-camara-deputados

  senadores:
    name: Sync senadores do Senado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deputados
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest:senado:senadores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_INGESTION_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: ingestion-senado-senadores

  proposicoes-camara:
    name: Sync proposições da Câmara
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: deputados
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest:camara:proposicoes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_INGESTION_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: ingestion-camara-proposicoes

  proposicoes-senado:
    name: Sync proposições do Senado
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: senadores
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest:senado:proposicoes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_INGESTION_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: ingestion-senado-proposicoes
