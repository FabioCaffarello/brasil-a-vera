name: LGPD cron diário

# Dispara o cron LGPD diário (Wave 10 Etapa 9.6). Endpoint
# `POST /api/cron/lgpd/run` em brasilavera.org faz:
#   1. Envia lembrete de hard-delete para usuários com deleted_at
#      entre 25-29 dias atrás (1 email por usuário, idempotente).
#   2. Hard delete de usuários com deleted_at >= 30 dias atrás.
#
# Cadência: 12:00 UTC = 9:00 BRT diariamente. Horário escolhido
# para cair em horário comercial brasileiro (suporte a debugging),
# longe do cron semanal (domingo 21 UTC) para não competir por
# recursos do Worker.
#
# Idempotência:
#   - Lembretes: idempotency_key = sha256(user_id + 'lgpd_reminder')
#     único no banco. Rodar o cron 2x no mesmo dia (ou em dias
#     diferentes da janela 25-29d) não duplica emails.
#   - Hard delete: SQL DELETE é idempotente — uma vez que a row
#     sumiu, o próximo run não a encontra.

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: lgpd-cron
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  trigger:
    name: Trigger /api/cron/lgpd/run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # checkout é obrigatório: trigger-cron e notify-failure são actions
      # locais (./.github/actions/*) e só resolvem com o repo no disco.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/trigger-cron
        with:
          endpoint: https://brasilavera.org/api/cron/lgpd/run
          cron-secret: ${{ secrets.CRON_SECRET }}
          context: lgpd-cron-diario
          webhook-url: ${{ secrets.DISCORD_INGESTION_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
