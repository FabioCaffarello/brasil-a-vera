name: Consolidation guard (RDS)

# Vigia a dívida de espelhamento da migração RDS (ADR-033;
# docs/migration/consolidation-debt.md). Advisory — comenta no PR sem
# falhar, mesmo padrão do pr-sanity. Três checagens:
#   1. original alterado sem a cópia-rds par;
#   2. cópia-rds alterada sem o original;
#   3. cópia-rds nova sob _components/ de rota /rds/ sem registro na
#      tabela (assert inverso — a tabela é enforçada, não voluntária).
# Falha fechado: tabela ilegível = job FALHA (exit 2), nunca verde cego.
# CI (não hook PostToolUse) porque drift também nasce de edição fora do
# Claude; o job vê tudo que o hook veria e mais.
# Lógica em .github/scripts/consolidation-guard.sh — testável localmente.
# Desliga sozinho: par consolidado sai da tabela; tabela vazia ao fim da
# migração = remover este workflow junto (registrado no ADR-033 §4).

on:
  pull_request:
    paths:
      - 'src/components/**'
      - 'src/app/rds/**'
      - 'docs/migration/consolidation-debt.md'
      # Auto-referência: PR que toca o guard exercita o guard — o
      # chamador (API → status\tpath) roda de ponta a ponta mesmo com
      # zero pares, eliminando por construção o gap "metade nova do
      # workflow nunca rodou" (lição do fix #380/#381).
      - '.github/workflows/consolidation-guard.yml'
      - '.github/scripts/consolidation-guard.sh'

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: consolidation-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Espelhamento cópias-rds × originais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # status + path (added/modified/...) — a checagem 2 isenta
          # cópias com status A (fix #380); --name-only não carrega status.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | [.status, .filename] | @tsv' > /tmp/changed.txt
          rc=0
          out=$(bash .github/scripts/consolidation-guard.sh docs/migration/consolidation-debt.md < /tmp/changed.txt) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Guard falhou fechado (rc=$rc) — ver stderr acima."
            exit "$rc"
          fi
          if [ -n "$out" ]; then
            {
              echo "## Consolidation guard (RDS) — avisos"
              echo
              printf '%s\n' "$out"
              echo
              echo "_Advisory (não bloqueia). Política de espelhamento: \`docs/migration/consolidation-debt.md\`._"
            } | gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" -F -
          else
            echo "Nenhum aviso — pares espelhados ou não tocados."
          fi
