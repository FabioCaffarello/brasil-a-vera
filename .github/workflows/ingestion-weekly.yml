name: Ingestão semanal

# Pipelines pesados que mudam pouco — domingo 03:00 UTC (00:00 BRT).
# Gastos CEAP: ~57k registros, ~2min. Cadência diária seria desperdício
# (a Câmara só atualiza despesas alguns dias após o documento).

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ingestion-weekly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  gastos-camara:
    name: Gastos CEAP da Câmara (ano corrente)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest:camara:gastos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_INGESTION_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: ingestion-camara-gastos

  # Tramitação: itera todas as proposições no banco e fetcha o histórico de
  # eventos de cada uma. Mais pesado que ingestões anteriores (~2 calls/prop
  # no Senado, ~1 no Câmara). Timeout generoso pra cobrir backfill inicial
  # das legislaturas 56 e 57.
  tramitacao-camara:
    name: Tramitação Câmara (todas as proposições)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest:camara:tramitacao
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_INGESTION_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: ingestion-camara-tramitacao

  tramitacao-senado:
    name: Tramitação Senado (todas as proposições)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest:senado:tramitacao
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_INGESTION_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: ingestion-senado-tramitacao
