name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Preview deploys de PR são gerados automaticamente pela integração nativa
# Cloudflare Workers Builds ↔ GitHub. Configure em:
#   Cloudflare Dashboard → Workers & Pages → Create → Connect to Git
# Esse workflow cobre apenas o deploy de produção em push para main.
#
# Secrets de runtime na Cloudflare (acessíveis via `process.env.X` com
# `nodejs_compat`):
# - DATABASE_URL e DIRECT_URL — bootstrappados idempotentemente a cada
#   deploy a partir dos GitHub Secrets (steps abaixo). Resiliente ao
#   incidente investigado em #52.
# - ADMIN_API_KEY — single-source no Cloudflare; o workflow só verifica
#   que ainda está setada e falha rápido caso não esteja.
# Ver docs/contributing/DEPLOYMENT.md.

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bootstrap idempotente dos Workers Secrets de runtime. Reproduz o
      # estado esperado a cada deploy a partir dos GitHub Secrets (fonte
      # de verdade compartilhada com a ingestão). Se um secret sumir
      # entre deploys — incidente investigado em #52, causa raiz
      # não-determinística — `wrangler secret put` restaura sem
      # intervenção manual. `printf '%s'` sem newline evita injetar `\n`
      # no valor.
      - name: Bootstrap runtime secrets from GitHub Secrets
        run: |
          printf '%s' "$DATABASE_URL_VALUE" | npx wrangler secret put DATABASE_URL
          printf '%s' "$DIRECT_URL_VALUE" | npx wrangler secret put DIRECT_URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL_VALUE: ${{ secrets.DATABASE_URL }}
          DIRECT_URL_VALUE: ${{ secrets.DIRECT_URL }}

      # ADMIN_API_KEY não é bootstrappada (single-source no Cloudflare por
      # design — não vive em GitHub Secrets). Verificação explícita aqui
      # falha rápido com mensagem clara caso ela tenha sumido; restore
      # manual é necessário porque não há fonte alternativa.
      - name: Verify ADMIN_API_KEY still set on Worker
        run: |
          set +e
          secrets=$(npx wrangler secret list 2>/dev/null)
          if ! echo "$secrets" | grep -q "ADMIN_API_KEY"; then
            echo "::error::ADMIN_API_KEY missing from Workers Secrets. Restore manually via 'wrangler secret put ADMIN_API_KEY' before re-running deploy."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Aplica migrations Drizzle ANTES do build/deploy. Fecha a janela de
      # schema/code drift que causou 5xx por ~10min após o merge do PR #73
      # (worker novo referenciava colunas que ainda não existiam no banco).
      # Idempotente — Drizzle Kit registra migrations já aplicadas via
      # tabela interna. Falha aborta o workflow inteiro (default) —
      # preferível a worker-novo-com-schema-antigo. Usa DIRECT_URL porque
      # Drizzle Kit emite DDL e a pooled connection do Neon não suporta
      # DDL transactions confiavelmente. Migrations destrutivas: aplicar
      # padrão expand-then-contract (ver docs/contributing/DEPLOYMENT.md).
      - name: Apply Drizzle migrations
        run: npm run db:migrate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Build with OpenNext for Cloudflare
        run: npm run cf:build
        env:
          # Placeholder: build é estático, não conecta ao banco. Driver
          # neon-http valida o formato da connection string eagerly no
          # constructor, então precisa de uma string válida (mas falsa) no
          # build. Em produção, o DATABASE_URL real vem dos Workers Secrets
          # da Cloudflare em runtime.
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder.neon.tech/placeholder?sslmode=require

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test against production
        # Roda probes concorrentes contra rotas representativas pós-deploy.
        # Falha o workflow se < 99% das requisições passarem. Detecta
        # regressões imediatas (Pool singleton, secrets sumidos, schema drift).
        # Para alertas ongoing de 5xx, ver docs/contributing/DEPLOYMENT.md.
        run: npm run smoke
        env:
          SMOKE_BASE_URL: https://brasil-a-vera.fabio-caffarello.workers.dev
