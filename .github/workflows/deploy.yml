name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Preview deploys de PR são gerados automaticamente pela integração nativa
# Cloudflare Workers Builds ↔ GitHub. Configure em:
#   Cloudflare Dashboard → Workers & Pages → Create → Connect to Git
# Esse workflow cobre apenas o deploy de produção em push para main.
#
# Secrets de runtime na Cloudflare (acessíveis via `process.env.X` com
# `nodejs_compat`):
# - DATABASE_URL e DIRECT_URL — bootstrappados idempotentemente a cada
#   deploy a partir dos GitHub Secrets (steps abaixo). Resiliente ao
#   incidente investigado em #52.
# - CLERK_SECRET_KEY e NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY —
#   bootstrappados idempotentemente. NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
#   também é exportada no env do step de build (Next.js inline
#   `NEXT_PUBLIC_*` no client bundle em build-time). Adição motivada
#   pelo incidente Sprint 4.2 PR 1 (todos /api/* e páginas 500 quando
#   Worker não tinha o secret, pós-merge de #152).
# - ADMIN_API_KEY — single-source no Cloudflare; o workflow só verifica
#   que ainda está setada e falha rápido caso não esteja.
# Ver docs/contributing/DEPLOYMENT.md.

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bootstrap idempotente dos Workers Secrets de runtime. Reproduz o
      # estado esperado a cada deploy a partir dos GitHub Secrets (fonte
      # de verdade compartilhada com a ingestão). Se um secret sumir
      # entre deploys — incidente investigado em #52, causa raiz
      # não-determinística — `wrangler secret put` restaura sem
      # intervenção manual. `printf '%s'` sem newline evita injetar `\n`
      # no valor.
      #
      # Secrets do Clerk (CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)
      # entram aqui após o incidente Sprint 4.2 PR 1 (PR #152): o matcher
      # amplo do clerkMiddleware passou a invocar `auth()` em toda request,
      # o que exige `CLERK_SECRET_KEY` no runtime do Worker. Sem o secret,
      # toda rota retorna 500. NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY também
      # entra como Worker secret porque o middleware server-side lê esse
      # valor em runtime para validar tokens — separadamente, o step de
      # build abaixo inline o mesmo valor no bundle client (UserButton,
      # SignInButton). Princípio 13: incidente registrado empíricamente.
      - name: Bootstrap runtime secrets from GitHub Secrets
        run: |
          printf '%s' "$DATABASE_URL_VALUE" | npx wrangler secret put DATABASE_URL
          printf '%s' "$DIRECT_URL_VALUE" | npx wrangler secret put DIRECT_URL
          printf '%s' "$CLERK_SECRET_KEY_VALUE" | npx wrangler secret put CLERK_SECRET_KEY
          printf '%s' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_VALUE" | npx wrangler secret put NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          printf '%s' "$CRON_SECRET_VALUE" | npx wrangler secret put CRON_SECRET
          printf '%s' "$RESEND_API_KEY_VALUE" | npx wrangler secret put RESEND_API_KEY
          printf '%s' "$RESEND_FROM_VALUE" | npx wrangler secret put RESEND_FROM
          printf '%s' "$IP_HASH_SALT_VALUE" | npx wrangler secret put IP_HASH_SALT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL_VALUE: ${{ secrets.DATABASE_URL }}
          DIRECT_URL_VALUE: ${{ secrets.DIRECT_URL }}
          CLERK_SECRET_KEY_VALUE: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_VALUE: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Wave 10 Etapa 7 — secret do cron de alertas (validado pelo
          # endpoint POST /api/cron/alertas/run via header x-cron-secret).
          CRON_SECRET_VALUE: ${{ secrets.CRON_SECRET }}
          # Wave 10 Etapa 7.3 — Resend (envio do email do report semanal).
          # RESEND_FROM tem formato "Display Name <addr@domain>" (ou
          # só addr@domain). Domain precisa estar verificado no
          # Resend Dashboard (DKIM/SPF/DMARC).
          RESEND_API_KEY_VALUE: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_VALUE: ${{ secrets.RESEND_FROM }}
          # Wave 10 Etapa 9.2 — Salt para hash de IP em consent_log
          # (LGPD art. 6º X). Sem o salt, ip_hash vira string vazia e
          # o log perde comprovação de origem. NÃO rotacionar sem
          # coordenação — invalida comparabilidade dos hashes
          # anteriores. Ver src/lib/ip-hash.ts.
          IP_HASH_SALT_VALUE: ${{ secrets.IP_HASH_SALT }}

      # ADMIN_API_KEY não é bootstrappada (single-source no Cloudflare por
      # design — não vive em GitHub Secrets). Verificação explícita aqui
      # falha rápido com mensagem clara caso ela tenha sumido; restore
      # manual é necessário porque não há fonte alternativa.
      - name: Verify ADMIN_API_KEY still set on Worker
        run: |
          set +e
          secrets=$(npx wrangler secret list 2>/dev/null)
          if ! echo "$secrets" | grep -q "ADMIN_API_KEY"; then
            echo "::error::ADMIN_API_KEY missing from Workers Secrets. Restore manually via 'wrangler secret put ADMIN_API_KEY' before re-running deploy."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Aplica migrations Drizzle ANTES do build/deploy. Fecha a janela de
      # schema/code drift que causou 5xx por ~10min após o merge do PR #73
      # (worker novo referenciava colunas que ainda não existiam no banco).
      # Idempotente — Drizzle Kit registra migrations já aplicadas via
      # tabela interna. Falha aborta o workflow inteiro (default) —
      # preferível a worker-novo-com-schema-antigo. Usa DIRECT_URL porque
      # Drizzle Kit emite DDL e a pooled connection do Neon não suporta
      # DDL transactions confiavelmente. Migrations destrutivas: aplicar
      # padrão expand-then-contract (ver docs/contributing/DEPLOYMENT.md).
      - name: Apply Drizzle migrations
        run: npm run db:migrate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Build with OpenNext for Cloudflare
        run: npm run cf:build
        env:
          # Placeholder: build é estático, não conecta ao banco. Driver
          # neon-http valida o formato da connection string eagerly no
          # constructor, então precisa de uma string válida (mas falsa) no
          # build. Em produção, o DATABASE_URL real vem dos Workers Secrets
          # da Cloudflare em runtime.
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder.neon.tech/placeholder?sslmode=require
          # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY precisa estar disponível no
          # build porque Next.js inline qualquer `process.env.NEXT_PUBLIC_*`
          # no client bundle (AuthIsland, UserButton). Sem isso, o chunk
          # client de Clerk é gerado com `undefined` no lugar da chave e
          # falha ao inicializar quando usuário autenticado renderiza
          # `<UserButton />`. Não é secret — `pk_*` é público por design.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test against production
        # Roda probes concorrentes contra rotas representativas pós-deploy.
        # Falha o workflow se < 99% das requisições passarem. Detecta
        # regressões imediatas (Pool singleton, secrets sumidos, schema drift).
        # Para alertas ongoing de 5xx, ver docs/contributing/DEPLOYMENT.md.
        run: npm run smoke
        env:
          SMOKE_BASE_URL: https://brasilavera.org
