name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Preview deploys de PR são gerados automaticamente pela integração nativa
# Cloudflare Workers Builds ↔ GitHub. Configure em:
#   Cloudflare Dashboard → Workers & Pages → Create → Connect to Git
# Esse workflow cobre apenas o deploy de produção em push para main.
#
# Pré-requisito de runtime (one-time, fora deste workflow):
#   npx wrangler secret put DATABASE_URL
#   npx wrangler secret put DIRECT_URL
# Esses secrets vivem como Workers Secrets na Cloudflare (não em GitHub).
# Com `nodejs_compat` em wrangler.jsonc, ficam acessíveis via process.env.X
# em runtime. Sem isso a aplicação crasha em produção ao tentar conectar no
# Neon. Ver docs/contributing/DEPLOYMENT.md para o procedimento completo.

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext for Cloudflare
        run: npm run cf:build
        env:
          # Placeholder: build é estático, não conecta ao banco. Driver
          # neon-http valida o formato da connection string eagerly no
          # constructor, então precisa de uma string válida (mas falsa) no
          # build. Em produção, o DATABASE_URL real vem dos Workers Secrets
          # da Cloudflare em runtime.
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder.neon.tech/placeholder?sslmode=require

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
