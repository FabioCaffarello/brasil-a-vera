name: CI

# Lint + build + tests + tests de integração com testcontainers.
# Dispara em push em main (smoke pós-merge) e em todo pull_request
# (gate de merge — required check em main). Concurrency cancela runs
# anteriores no mesmo ref quando há push novo, economizando minutos.
#
# Não roda em outras branches por push direto — discipline de PR-only.
# Workflow_dispatch ausente por design (CI roda em código, não em
# botão). Ver docs/contributing/WORKFLOWS.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Matriz determinística dos hooks do .claude/ (shell + jq, ~5s).
      # Roda SEMPRE, sem path filter: a suíte ficou vermelha por ~3
      # semanas pós-Wave 10 porque só rodava manualmente (PR #365), e
      # path filter criaria check "expected" eterno se fosse promovido
      # a required. Inclui o caso de consistência ROLES.md ↔ matchers.
      - name: Hooks test matrix (.claude)
        run: bash .claude/hooks/__tests__/test-hooks.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm ci
      - run: npm run ci
      - run: npm run build
        env:
          # Placeholder: build é estático, não conecta ao banco. Driver
          # neon-http valida o formato da connection string eagerly no
          # constructor, então precisa de uma string válida (mas falsa) no
          # build. Em produção, o DATABASE_URL real vem dos Workers Secrets
          # da Cloudflare em runtime.
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder.neon.tech/placeholder?sslmode=require

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm ci
      - run: npm run test:coverage

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - run: npm ci
      # Linux runners têm Docker pré-instalado e daemon rodando;
      # testcontainers sobe postgres:17-alpine e aplica migrations.
      # Limitação reconhecida no ADR-015: driver `pg` ≠ driver de
      # produção (neon-http no app, neon-serverless na ingestão).
      - run: npm run test:integration
