name: Alertas semanais (cron)

# Dispara o cron de envio de alertas para usuários da área logada
# (Wave 10 Etapa 7). Endpoint `POST /api/cron/alertas/run` em
# brasilavera.org agrega votos/proposições/gastos/divergências da
# semana e registra deliveries pendentes (sub-PR 7.3 enviará via
# Resend; sub-PRs 7.1/7.2 já entregam infra + body real).
#
# Cadência: domingo 21:00 UTC = 18:00 BRT (Brasil sem horário de
# verão desde Decreto 9.772/2019). Cron Trigger nativo Cloudflare
# poderia ter latência menor mas exige customização do worker
# OpenNext — adiar até evidência empírica de drift.
#
# Idempotência: o endpoint usa idempotency_key = sha256(user_id +
# period_start + cadence + channel) com UNIQUE no banco. Rodar duas
# vezes na mesma janela não duplica.

on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

concurrency:
  group: alertas-cron
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  trigger:
    name: Trigger /api/cron/alertas/run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # checkout é obrigatório: trigger-cron e notify-failure são actions
      # locais (./.github/actions/*) e só resolvem com o repo no disco.
      - uses: actions/checkout@v6
      - uses: ./.github/actions/trigger-cron
        with:
          endpoint: https://brasilavera.org/api/cron/alertas/run
          cron-secret: ${{ secrets.CRON_SECRET }}
          context: alertas-cron-semanal
          webhook-url: ${{ secrets.DISCORD_INGESTION_WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
